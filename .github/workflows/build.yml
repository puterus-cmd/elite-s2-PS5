name: Build and test Elite S2 PS5

on:
  push:
    branches: [release/0.3.3-beta]
    paths:
      - 'elite-s2-PS5-0.3.3-beta.zip'
      - 'gui-polish.patch'
      - 'diagnostics-beta2.patch'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract baseline source archive
        run: |
          test -s elite-s2-PS5-0.3.3-beta.zip
          mkdir -p build-src
          unzip -q elite-s2-PS5-0.3.3-beta.zip -d build-src
          test -f build-src/Makefile

      - name: Apply beta.1 GUI polish
        run: |
          test -s gui-polish.patch
          git apply --directory=build-src gui-polish.patch
          grep -q '0.3.3-beta.1' build-src/src/version.h

      - name: Apply beta.2 diagnostics
        run: |
          test -s diagnostics-beta2.patch
          git apply --directory=build-src diagnostics-beta2.patch
          grep -q '0.3.3-beta.2' build-src/src/version.h
          python3 build-src/tools/embed.py build-src/web/index.html build-src/src/web_page.c web_page_html

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 unzip zip curl clang-18 lld-18 llvm-18-dev
          sudo ln -sf /usr/bin/llvm-config-18 /usr/local/bin/llvm-config

      - name: Run host tests
        working-directory: build-src
        run: make test

      - name: Run parser fuzz tests
        working-directory: build-src
        run: make fuzz

      - name: Install PS5 payload SDK v0.45
        run: |
          curl -fL --retry 3 \
            https://github.com/ps5-payload-dev/sdk/releases/download/v0.45/ps5-payload-sdk.zip \
            -o "$RUNNER_TEMP/ps5-payload-sdk.zip"
          mkdir -p "$RUNNER_TEMP/sdk-unpack"
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP/sdk-unpack"
          if [ -f "$RUNNER_TEMP/sdk-unpack/toolchain/prospero.mk" ]; then
            SDK="$RUNNER_TEMP/sdk-unpack"
          elif [ -f "$RUNNER_TEMP/sdk-unpack/ps5-payload-sdk/toolchain/prospero.mk" ]; then
            SDK="$RUNNER_TEMP/sdk-unpack/ps5-payload-sdk"
          else
            echo "SDK archive did not contain toolchain/prospero.mk" >&2
            find "$RUNNER_TEMP/sdk-unpack" -maxdepth 3 -type f | head -50
            exit 1
          fi
          echo "PS5_PAYLOAD_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Build PS5 ELF
        working-directory: build-src
        run: make ps5

      - name: Package patched source tree
        run: |
          (cd build-src && zip -qr ../elite-s2-PS5-0.3.3-beta.2-patched-source.zip . -x 'build/*' 'dist/*')

      - name: Verify ELF and write checksum
        working-directory: build-src
        run: |
          ELF="dist/PadBridge-PS5-0.3.3-beta.2.elf"
          test -s "$ELF"
          sha256sum "$ELF" | tee "$ELF.sha256"

      - name: Upload ELF and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elite-s2-PS5-0.3.3-beta.2
          path: |
            build-src/dist/PadBridge-PS5-0.3.3-beta.2.elf
            build-src/dist/PadBridge-PS5-0.3.3-beta.2.elf.sha256
            elite-s2-PS5-0.3.3-beta.zip
            elite-s2-PS5-0.3.3-beta.2-patched-source.zip
            gui-polish.patch
            diagnostics-beta2.patch
          if-no-files-found: error
